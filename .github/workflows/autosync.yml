name: Scheduled Upstream Sync

on:
  schedule:
    # Runs every day at midnight (UTC). Adjust the cron schedule as needed.
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows you to manually trigger the sync via the UI

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync upstream changes
        # Authenticates the request using the repository's native token
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://github.com{{ github.repository }}/merge-upstream \
            -d '{"branch":"main"}' 
